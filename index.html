<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bateria Virtual</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        
<link rel="icon" type="image/png" href="vendor/favicon.png" /></head>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>Virtua Drums</h1>
    <a id="disp">Computador - PC</a>    
    <div class="drum-kit">
        
        <span id="caixa" style="background-image: url(./imgs/caixa.png)" class="drum img" data-key="a">
            <small class="label">a ou l</small>
        </span>
        <span id="bumbo" style="background-image: url(./imgs/bumbo.png)" class="drum img" data-key="s">
            <small class="label">c</small>
        </span>

        <span id="surdo" style="background-image: url(./imgs/surdo.png)" class="drum img" data-key="n">
            <small class="label">n</small>
        </span>

        <span id="tom" style="background-image: url(./imgs/tom.png)" class="drum img" data-key="m">
            <small class="label">m</small>
        </span>

        <span id="chimbau" style="background-image: url(./imgs/chimbau.png)" class="drum img" data-key="i">
            <small class="label">k</small>
        </span>
        <span id="chimbauA" style="background-image: url(./imgs/chimbauA.png)" class="drum img" data-key="i">
            <small class="label">I</small>
        </span>

        <span id="conducao" style="background-image: url(./imgs/conducao.png)" class="drum img" data-key=",">
            <small class="label">,</small>
        </span>

        <span id="sino" style="background-image: url(./imgs/conducao.png)" class="drum img" data-key=".">
            <small class="label">.</small>
        </span>

        <span id="crash" style="background-image: url(./imgs/crash.png)" class="drum img" data-key="o">
            <small class="label">o</small>
        </span>

        <span id="ataque" style="background-image: url(./imgs/ataque.png)" class="drum img" data-key="p">
            <small class="label bi-keyboard">p</small>
        </span>
        
        <span id="bloco" style="background-image: url(./imgs/bloco.png)" class="drum img" data-key="z">
            <small class="label bi-keyboard">z</small>
        </span>
    </div>
    <script type="module" src="./js/index.mjs"></script>
</body>
</html>
