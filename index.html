<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>BunnyDrum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="vendor/favico.png" /></head>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="flex-column justContBetween ">
    
    <header class="main-header flex" style="padding:3vh">    
           
        <span class="showDesk flex-row" style="align-items:center;gap:1vh">
            <img src ="vendor/favico.png"class='logo'  alt="logo">
            Bunny Drums
        </span>

        <div id="menuBotoes" class="flex-row  w100" style="gap:2vw">
            
            <button class="showDesk active flex-row btnAside" data-target="keys-container" style="align-items:center;gap:1vh">
                <i class="bi-keyboard"></i>
                Teclas
            </button>

            <button class="active flex-row btnAside" data-target="batera" style="align-items:center">
                <img src="./imgs/heavy/bumbo.png" class="inst-thumb">
                <span>Batera</span>
            </button>
          
            <button class="flex-row btnAside" data-target="divSequencer" style="align-items:center;gap:1vh">
                <i class="bi-keyboard"></i>
                Sequencer
            </button>
            <button class="flex-row btnAside" data-target="equalizer" style="align-items:center;gap:1vh">
                <i class="bi-bar-chart-fill"></i>
                Equalizer
            </button>
        </div>
            
    </header>
    
    <span id="advise" class="bi-phone-fill flex" style="font-size: 1em; gap:1vh">
        Vire o celular na horizontal
    </span>
     
    <main class="flex-row justBetween">

        <aside id="keys-container" class="off sideMenu flex-column justAround">
                <span>Mapa de Teclas</span>
            <div class="keymap-list" aria-label="Mapa de teclas">
                <div class="keymap-header keymap-row">
                    <div class="label">Inst</div>
                    <div class="key">Tecla</div>
                </div>
                <div class="keymap-row"><div class="label">Caixa</div><div class="key">a ou l</div></div>
                <div class="keymap-row"><div class="label">Bumbo</div><div class="key">c</div></div>
                <div class="keymap-row"><div class="label">Surdo</div><div class="key">m</div></div>
                <div class="keymap-row"><div class="label">Tom</div><div class="key">u</div></div>
                <div class="keymap-row"><div class="label">Chimbau</div><div class="key">k</div></div>
                <div class="keymap-row"><div class="label">ChimbauA</div><div class="key">I</div></div>
                <div class="keymap-row"><div class="label">Condução</div><div class="key">,</div></div>
                <div class="keymap-row"><div class="label">Sino</div><div class="key">.</div></div>
                <div class="keymap-row"><div class="label">Crash</div><div class="key">o</div></div>
                <div class="keymap-row"><div class="label">Ataque</div><div class="key">p</div></div>
                <div class="keymap-row"><div class="label">Bloco</div><div class="key">z</div></div>
            </div>
        </aside>

        <aside id="equalizer" class="off sideMenu flex-column justAround" aria-label="Equalizador">
            <span class="">Equalizer</span>

            <section class="flex-row justCenter eq-panel" style="flex-basis:75%">
            
                <div class="eq-band">
                    <label for="lowGain">Graves <span id="lowValue">0</span>dB</label>
                    <div>
                        <input id="lowGain" type="range" min="-12" max="12" step="1" value="0">
                    </div>
                </div>

                <div class="eq-band">
                    <label for="midGain">Médios <span id="midValue">0</span>dB</label>
                    <div>
                        <input id="midGain" type="range" min="-12" max="12" step="1" value="-10">
                    </div>
                </div>

                <div class="eq-band">
                    <label for="highGain">Agudos <span id="highValue">0</span>dB</label>
                    <div>
                        <input id="highGain" type="range" min="-12" max="12" step="1" value="0">
                    </div>
                </div>
            
                <div class="eq-band">
                    <label for="reverbWet">Reverb <span id="reverbWetValue">0</span>%</label>
                    <div>
                        <input id="reverbWet" type="range" min="0" max="100" step="1" value="0">
                    </div>
                </div>

                <div class="eq-band">
                    <label for="reverbDuration">Duração <span id="reverbDurationValue">1.2</span>s</label>
                    <div>
                        <input id="reverbDuration" type="range" min="0.3" max="3" step="0.1" value="1.2">
                    </div>
                </div>

            </section>

        </aside>

        <article id="batera" class="w100 sideMenu flex justCenter" style="position: relative;">
        
            <section id="drumkit"  class="off drum-kit flex justCenter" 
                style="position:relative;" >
                
                <span id="caixa" style="background-image: url(./imgs/normal/caixa.svg)" class="drum img" data-key="a">
                    <small class="label clip">a ou l</small>
                </span>
                <span id="bumbo" style="background-image: url(./imgs/normal/bumbo.svg)" class="drum img" data-key="c">
                    <small class="label clip">c</small>
                </span>

                <span id="surdo" style="background-image: url(./imgs/normal/surdo.svg)" class="drum img" data-key="m">
                    <small class="label clip">m</small>
                </span>

                <span id="tom" style="background-image: url(./imgs/normal/tom.svg)" class="drum img" data-key="o">
                    <small class="label clip">o</small>
                </span>

                <span id="chimbau" style="background-image: url(./imgs/normal/chimbau.svg)" class="drum img" data-key="k">
                    <small class="label clip">k</small>
                </span>
                <span id="chimbauOp" style="background-image: url(./imgs/normal/chimbauOp.svg)" class="drum img" data-key="i">
                    <small class="label clip">I</small>
                </span>

                <span id="conducao" style="background-image: url(./imgs/normal/conducao.svg)" class="drum img" data-key=";">
                    <small class="label clip">;</small>
                </span>

                <span id="sino" style="background-image: url(./imgs/normal/conducao.svg)" class="drum img" data-key="[">
                    <small class="label clip">[</small>
                </span>

                <span id="crash" style="background-image: url(./imgs/normal/crash.svg)" class="drum img" data-key="q">
                    <small class="label clip">q</small>
                </span>

                <span id="ataque" style="background-image: url(./imgs/normal/ataque.svg)" class="drum img" data-key="p">
                    <small class="label clip">p</small>
                </span>
                
                <span id="bloco" style="background-image: url(./imgs/normal/bloco.svg)" class="drum img" data-key="z">
                    <small class="label clip">z</small>
                </span>
            </section>

            <section id="modelos" class="flex-column">
                <button id="heavy"  class="btnModelo">Heavy</button>
                <button id="normal" class="btnModelo">Normal</button>
                <button id="light"  class="btnModelo">Light</button>
                <button id="perc"   class="btnModelo">Percussão</button>
            </section>
        
        </article>

         <article id="divSequencer" class="off sideMenu  flex w100 ">

            <article id="sequencer-meta-controls" class="flex-column justBetween">
                <section class="box flex-column" style="height: 80%;">

                    <div class="boxHeader" style="flex-basis: 10%;">
                        
                        <select id="step-count">
                            <option value="16">16 Passos</option>
                            <option value="8">8 Passos</option>
                            <option value="4">4 Passos</option>
                            <option value="2">2 Passos</option>
                        </select>

                    </div>


                     <div class="boxBody flex-column flex-around" style="flex-basis: 80%;">
                        <input id="bpm" type="range" min="60" max="220" step="1" value="125" style="
                                width: 12em;
                                rotate: -90deg;
                                translate: 0 80px;
                            ">
                    </div>

                    <div class="boxFooter flex-column" style="flex-basis: 10%;">
                        
                        <label for="bpm" >
                            <small id="bpmValue">125
                            </small> 
                            <small> BPM</small>
                        </label>
                    </div>

                </section>

                

                  <section class="flex justAround w100">
                    <button id="seq" class="eq-button" aria-label="playseq"
                            style="font-size: 25px;">
                            <i class="bi-play-fill"></i>
                        </button>
                        <button id="stop" class="eq-button" aria-label="stopseq"
                            style="font-size: 25px;">
                            <i class="bi-stop-fill"></i>
                        </button>
                        <button id="clear-grid" class="eq-button" aria-label="reset"
                            style="font-size: 25px;">
                            <i class="bi-arrow-counterclockwise"></i>
                        </button>
                 </section>

            </article>

            <section id="sequencer-grid-container" class="flex-column"></section>
                
        </article>

    </main>

    <footer class="flex showDesk" >
        Bruno Oliveira
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script type="module" src="./js/index.mjs"></script>
</body>
</html>
