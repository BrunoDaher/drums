<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BunnyDrum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        
<link rel="icon" type="image/png" href="vendor/favico.png" /></head>
    <link rel="stylesheet" href="./css/style.css">
</head>



<body class="flex-column justContBetween ">
    
    <header class="main-header flex justBetween">    
            <span class="flex-row" style="align-items:center;gap:1vh">
                <img src ="vendor/favico.png"class='logo'  alt="logo">
                Bunny Drums
            </span>
            <span id="disp" class="bi-laptop" style="font-size: 1em">
               PC - Notebook
            </span>

            


    </header>
    
    <span id="advise" class="bi-phone-fill flex" style="font-size: 1em; gap:1vh">
                Vire o celular na horizontal
    </span>
     
     <!--Teclas-->
    
    <main class="flex-row justCenter">

        <aside id="keys-container" class="flex-column">
                
            <div class="keymap-list" aria-label="Mapa de teclas">
                <div class="keymap-header keymap-row">
                    <div class="label">Inst</div>
                    <div class="key">Tecla</div>
                </div>
                <div class="keymap-row"><div class="label">Caixa</div><div class="key">a ou l</div></div>
                <div class="keymap-row"><div class="label">Bumbo</div><div class="key">c</div></div>
                <div class="keymap-row"><div class="label">Surdo</div><div class="key">n</div></div>
                <div class="keymap-row"><div class="label">Tom</div><div class="key">m</div></div>
                <div class="keymap-row"><div class="label">Chimbau</div><div class="key">k</div></div>
                <div class="keymap-row"><div class="label">ChimbauA</div><div class="key">I</div></div>
                <div class="keymap-row"><div class="label">Condução</div><div class="key">,</div></div>
                <div class="keymap-row"><div class="label">Sino</div><div class="key">.</div></div>
                <div class="keymap-row"><div class="label">Crash</div><div class="key">o</div></div>
                <div class="keymap-row"><div class="label">Ataque</div><div class="key">p</div></div>
                <div class="keymap-row"><div class="label">Bloco</div><div class="key">z</div></div>
            </div>
        </aside>

        <article class="flex-column justCenter">
            <span>Modelos </span>
            <section id="modelos" class="flex-column justBetween" style="">
                
                <button class="card" id="heavy">Heavy</button>
                <button class="card" id="normal">Normal</button>
                <button id="light" class="card ">Light</button>
                <button class="card" id="perc">Percussão</button>

            </section>
        </article>
    
    <!--batera-->
        <article id="batera" class="drum-kit flex justCenter" 
            style="width: 100%; position:relative;" >
            
            <span id="caixa" style="background-image: url(./imgs/normal/caixa.png)" class="drum img" data-key="a">
                <small class="label">a ou l</small>
            </span>
            <span id="bumbo" style="background-image: url(./imgs/normal/bumbo.png)" class="drum img" data-key="c">
                <small class="label">c</small>
            </span>

            <span id="surdo" style="background-image: url(./imgs/normal/surdo.png)" class="drum img" data-key="m">
                <small class="label">m</small>
            </span>

            <span id="tom" style="background-image: url(./imgs/normal/tom.png)" class="drum img" data-key="o">
                <small class="label">o</small>
            </span>

            <span id="chimbau" style="background-image: url(./imgs/normal/chimbau.png)" class="drum img" data-key="k">
                <small class="label">k</small>
            </span>
            <span id="chimbauOp" style="background-image: url(./imgs/normal/chimbauOp.png)" class="drum img" data-key="i">
                <small class="label">I</small>
            </span>

            <span id="conducao" style="background-image: url(./imgs/normal/conducao.png)" class="drum img" data-key=";">
                <small class="label">;</small>
            </span>

            <span id="sino" style="background-image: url(./imgs/normal/conducao.png)" class="drum img" data-key="[">
                <small class="label">[</small>
            </span>

            <span id="crash" style="background-image: url(./imgs/normal/crash.png)" class="drum img" data-key="q">
                <small class="label">q</small>
            </span>

            <span id="ataque" style="background-image: url(./imgs/normal/ataque.png)" class="drum img" data-key="p">
                <small class="label bi-keyboard">p</small>
            </span>
            
            <span id="bloco" style="background-image: url(./imgs/normal/bloco.png)" class="drum img" data-key="z">
                <small class="label bi-keyboard">z</small>
            </span>
        </article>

         <aside id="controles" class="eq-container flex-column">
                <section class="eq-panel flex-column" aria-label="Equalizador">
                    <div class="eq-band">
                        <label for="lowGain">Graves <span id="lowValue">0</span>dB</label>
                        <input id="lowGain" type="range" min="-12" max="12" step="1" value="0">
                    </div>
                    <div class="eq-band">
                        <label for="midGain">Médios <span id="midValue">0</span>dB</label>
                        <input id="midGain" type="range" min="-12" max="12" step="1" value="-10">
                    </div>
                    <div class="eq-band">
                        <label for="highGain">Agudos <span id="highValue">0</span>dB</label>
                        <input id="highGain" type="range" min="-12" max="12" step="1" value="0">
                    </div>
                
                    <div class="eq-band">
                        <label for="reverbWet">Reverb <span id="reverbWetValue">0</span>%</label>
                        <input id="reverbWet" type="range" min="0" max="100" step="1" value="0">
                    </div>
                    <div class="eq-band">
                        <label for="reverbDuration">Duração <span id="reverbDurationValue">1.2</span>s</label>
                        <input id="reverbDuration" type="range" min="0.3" max="3" step="0.1" value="1.2">
                    </div>
                </section>
        </aside>

    </main>

    <footer class="flex" >
        Bruno Oliveira
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <script type="module" src="./js/index.mjs"></script>
</body>
</html>
